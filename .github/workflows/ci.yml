name: CI
on: [push, pull_request]
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
      - run: python tests/test_verifier.py
      - run: python tests/test_retrieval.py
      - run: python tests/test_multivector.py
      - run: python tests/test_bench_suite_target.py
      - name: Install pytest (pinned) for the pytest-style endpoint admission suite
        run: python -m pip install --disable-pip-version-check "pytest==9.1.1"
      - name: Endpoint admission, dense responses, and measurement inputs
        run: python -m pytest -q tests/test_endpoint_admission.py tests/test_dense_response_integrity.py tests/test_measurement_inputs.py
