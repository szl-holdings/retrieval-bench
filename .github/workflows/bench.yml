name: receipt-verification

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: receipt-verification-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Verify receipt chain (fail-closed)
        run: |
          set -euo pipefail
          compgen -G "receipts/*.json" > /dev/null || {
            echo "receipt chain is missing" >&2
            exit 2
          }
          python verify/verifier.py receipts/*.json
