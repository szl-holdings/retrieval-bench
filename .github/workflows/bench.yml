name: receipt-verification

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: receipt-verification-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Verify receipt chain (fail-closed)
        run: |
          set -euo pipefail
          compgen -G "receipts/*.json" > /dev/null || {
            echo "receipt chain is missing" >&2
            exit 2
          }
          python verify/verifier.py receipts/*.json
