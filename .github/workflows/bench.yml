name: receipt-verification

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: receipt-verification-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Verify receipt chain (fail-closed)
        run: |
          set -euo pipefail
          compgen -G "receipts/*.json" > /dev/null || {
            echo "receipt chain is missing" >&2
            exit 2
          }
          python verify/verifier.py receipts/*.json
